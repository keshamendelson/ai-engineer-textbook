<!doctype html>
<html lang="ru" data-theme="light">
<head>
<meta charset="utf-8">
<title>проба демо спектрограммы</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<main style="padding:2rem;max-width:44rem;margin:0 auto">

<div class="demo">
  <span class="dt">Попробуйте · спектрограмма и размен между временем и частотой</span>
  <p style="font-family:var(--font-ui);font-size:.85rem;color:var(--ink-2);margin-bottom:.8rem">
    Сигнал длиной в одну секунду при частоте дискретизации 8000 Гц: сначала ровный тон, потом скользящий вверх свист, в конце два тона сразу. Меняйте длину окна и шаг и смотрите, что происходит с картинкой.
  </p>
  <div class="row">
    <label>Длина окна <span class="val" id="sp-nv">256 отсчётов</span>
      <input type="range" id="sp-n" min="6" max="10" step="1" value="8">
    </label>
    <label>Шаг окна <span class="val" id="sp-hv">четверть окна</span>
      <input type="range" id="sp-h" min="1" max="3" step="1" value="2">
    </label>
  </div>
  <label style="margin-top:.4rem">Шкала частот
    <select id="sp-scale">
      <option value="lin">линейная, в герцах</option>
      <option value="mel">мел-шкала</option>
    </select>
  </label>
  <canvas id="sp-canvas" width="640" height="220" style="width:100%;margin-top:.7rem;border-radius:8px"></canvas>
  <div class="out" id="sp-out"></div>
</div>

</main>
<script>
/* демо: спектрограмма, окно и шаг */
(function () {
  var cv = document.getElementById("sp-canvas");
  if (!cv) return;
  var ctx = cv.getContext("2d");
  var out = document.getElementById("sp-out");
  var elN = document.getElementById("sp-n"), elH = document.getElementById("sp-h");
  var elScale = document.getElementById("sp-scale");
  var FS = 8000, DUR = 1.0, LEN = FS * DUR;

  // сигнал: тон, скользящий вверх свист, два тона сразу, плюс лёгкий шум
  var sig = new Float32Array(LEN);
  (function build() {
    var seed = 7;
    function rnd() { seed = (seed * 1103515245 + 12345) % 2147483648; return seed / 2147483648 - 0.5; }
    for (var i = 0; i < LEN; i++) {
      var t = i / FS, v = 0;
      if (t < 0.36) v += Math.sin(2 * Math.PI * 300 * t);
      if (t > 0.30 && t < 0.72) {
        var u = (t - 0.30) / 0.42;
        v += Math.sin(2 * Math.PI * (400 + 1400 * u) * t);
      }
      if (t > 0.62) { v += 0.8 * Math.sin(2 * Math.PI * 700 * t) + 0.6 * Math.sin(2 * Math.PI * 1500 * t); }
      sig[i] = v + 0.05 * rnd();
    }
  })();

  function fft(re, im) {
    var n = re.length;
    for (var i = 1, j = 0; i < n; i++) {
      var bit = n >> 1;
      for (; j & bit; bit >>= 1) j ^= bit;
      j ^= bit;
      if (i < j) {
        var tr = re[i]; re[i] = re[j]; re[j] = tr;
        var ti = im[i]; im[i] = im[j]; im[j] = ti;
      }
    }
    for (var len = 2; len <= n; len <<= 1) {
      var ang = -2 * Math.PI / len;
      var wr = Math.cos(ang), wi = Math.sin(ang);
      for (var s = 0; s < n; s += len) {
        var cr = 1, ci = 0;
        for (var k = 0; k < len / 2; k++) {
          var ur = re[s + k], ui = im[s + k];
          var vr = re[s + k + len / 2] * cr - im[s + k + len / 2] * ci;
          var vi = re[s + k + len / 2] * ci + im[s + k + len / 2] * cr;
          re[s + k] = ur + vr; im[s + k] = ui + vi;
          re[s + k + len / 2] = ur - vr; im[s + k + len / 2] = ui - vi;
          var nr = cr * wr - ci * wi; ci = cr * wi + ci * wr; cr = nr;
        }
      }
    }
  }

  function css(name) {
    return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  }
  function rgb(hex) {
    hex = hex.replace("#", "");
    if (hex.length === 3) hex = hex.split("").map(function (c) { return c + c; }).join("");
    return [parseInt(hex.slice(0, 2), 16), parseInt(hex.slice(2, 4), 16), parseInt(hex.slice(4, 6), 16)];
  }
  function melOf(f) { return 2595 * Math.log10(1 + f / 700); }

  function draw() {
    var N = Math.pow(2, +elN.value);
    var hopDiv = [0, 2, 4, 8][+elH.value];
    var hop = Math.max(1, N / hopDiv);
    var frames = Math.floor((LEN - N) / hop) + 1;
    var bins = N / 2;
    var mel = elScale.value === "mel";

    var mag = [], peak = 1e-9;
    for (var f = 0; f < frames; f++) {
      var re = new Float64Array(N), im = new Float64Array(N);
      for (var i = 0; i < N; i++) {
        var w = 0.54 - 0.46 * Math.cos(2 * Math.PI * i / (N - 1)); // окно Хэмминга
        re[i] = sig[f * hop + i] * w;
      }
      fft(re, im);
      var col = new Float64Array(bins);
      for (var b = 0; b < bins; b++) {
        var m = Math.sqrt(re[b] * re[b] + im[b] * im[b]);
        col[b] = Math.log10(1 + m);
        if (col[b] > peak) peak = col[b];
      }
      mag.push(col);
    }

    var W = cv.width, H = cv.height;
    var bg = rgb(css("--paper-2") || "#f1eee7"), fg = rgb(css("--accent") || "#4338ca");
    var img = ctx.createImageData(W, H);
    var maxF = FS / 2, maxMel = melOf(maxF);
    for (var x = 0; x < W; x++) {
      var fi = Math.min(frames - 1, Math.floor(x / W * frames));
      for (var y = 0; y < H; y++) {
        var up = 1 - y / H;
        var freq = mel ? 700 * (Math.pow(10, up * maxMel / 2595) - 1) : up * maxF;
        var b2 = Math.min(bins - 1, Math.round(freq / maxF * bins));
        var v = Math.min(1, mag[fi][b2] / peak);
        v = Math.pow(v, 0.75);
        var o = (y * W + x) * 4;
        img.data[o] = bg[0] + (fg[0] - bg[0]) * v;
        img.data[o + 1] = bg[1] + (fg[1] - bg[1]) * v;
        img.data[o + 2] = bg[2] + (fg[2] - bg[2]) * v;
        img.data[o + 3] = 255;
      }
    }
    ctx.putImageData(img, 0, 0);

    document.getElementById("sp-nv").textContent = N + " отсчётов";
    document.getElementById("sp-hv").textContent =
      hopDiv === 2 ? "половина окна" : hopDiv === 4 ? "четверть окна" : "восьмая окна";
    out.innerHTML =
      "Окно " + N + " отсчётов это " + (N / FS * 1000).toFixed(1) + " мс звука. " +
      "Разрешение по частоте " + (FS / N).toFixed(1) + " Гц на полосу, кадров получилось " + frames + ".<br>" +
      (N <= 128
        ? "Короткое окно хорошо видит момент, когда звук изменился, и плохо различает близкие частоты: полосы размазаны по вертикали."
        : N >= 512
          ? "Длинное окно точно показывает частоты, но смазывает время: резкие переходы растягиваются по горизонтали."
          : "Середина диапазона. Обычно для речи берут окно 20 или 25 мс и шаг 10 мс, это как раз около 200 отсчётов при 8 кГц.") +
      "<br>" + (mel
        ? "Мел-шкала растягивает низ и сжимает верх: там, где человеческий слух различает тоны хуже, полос отводится меньше."
        : "Линейная шкала отдаёт половину картинки частотам выше двух килогерц, где для речи почти ничего не происходит.");
  }

  [elN, elH, elScale].forEach(function (el) { el.addEventListener("input", draw); });
  new MutationObserver(draw).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
  draw();
})();
</script>
</body>
</html>
