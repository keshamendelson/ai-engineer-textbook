<!doctype html>
<html lang="ru" data-theme="light">
<head>
<meta charset="utf-8">
<title>проба демо задержки</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<main style="padding:2rem;max-width:44rem;margin:0 auto">

<div class="demo">
  <span class="dt">Попробуйте · бюджет задержки голосового агента</span>
  <p style="font-family:var(--font-ui);font-size:.85rem;color:var(--ink-2);margin-bottom:.8rem">
    Человек замолчал. Считаем, сколько пройдёт времени до первого звука ответа. Двигайте ползунки и смотрите, какая часть съедает бюджет.
  </p>
  <div class="row">
    <label>Сеть туда и обратно <span class="val" id="lt-net-v">80 мс</span>
      <input type="range" id="lt-net" min="10" max="400" step="10" value="80">
    </label>
    <label>Порог паузы до решения «реплика кончилась» <span class="val" id="lt-eou-v">500 мс</span>
      <input type="range" id="lt-eou" min="100" max="1200" step="50" value="500">
    </label>
  </div>
  <div class="row">
    <label>Распознавание хвоста реплики <span class="val" id="lt-asr-v">120 мс</span>
      <input type="range" id="lt-asr" min="20" max="800" step="20" value="120">
    </label>
    <label>Обдумывание до первого токена <span class="val" id="lt-llm-v">400 мс</span>
      <input type="range" id="lt-llm" min="100" max="2000" step="50" value="400">
    </label>
  </div>
  <div class="row">
    <label>Синтез до первого звука <span class="val" id="lt-tts-v">150 мс</span>
      <input type="range" id="lt-tts" min="30" max="900" step="10" value="150">
    </label>
    <label>Режим работы
      <select id="lt-mode">
        <option value="stream">потоковый: распознавание идёт во время речи, синтез стартует с первой фразы</option>
        <option value="batch">пакетный: каждый этап ждёт полного результата предыдущего</option>
      </select>
    </label>
  </div>
  <div id="lt-bar" style="display:flex;height:34px;border-radius:6px;overflow:hidden;margin:.9rem 0 .4rem"></div>
  <div class="out" id="lt-out"></div>
</div>

</main>
<script>
/* демо: из чего складывается задержка ответа голосового агента */
(function () {
  var bar = document.getElementById("lt-bar");
  if (!bar) return;
  var out = document.getElementById("lt-out");
  var ids = ["net", "eou", "asr", "llm", "tts"];
  var el = {};
  ids.forEach(function (k) { el[k] = document.getElementById("lt-" + k); });
  var mode = document.getElementById("lt-mode");

  var meta = {
    net: { name: "сеть", tint: "--ink-3" },
    eou: { name: "пауза", tint: "--warn" },
    asr: { name: "распознавание", tint: "--accent" },
    llm: { name: "модель", tint: "--analogy" },
    tts: { name: "синтез", tint: "--practice" },
  };

  function draw() {
    var v = {};
    ids.forEach(function (k) {
      v[k] = +el[k].value;
      document.getElementById("lt-" + k + "-v").textContent = v[k] + " мс";
    });

    var stream = mode.value === "stream";
    var parts = ids.map(function (k) {
      var ms = v[k];
      // в потоковом режиме распознавание уже отработало на речи, остаётся только хвост,
      // а синтез начинает говорить, не дожидаясь конца ответа модели
      if (stream && k === "asr") ms = Math.round(ms * 0.35);
      if (stream && k === "tts") ms = Math.round(ms * 0.6);
      return { k: k, ms: ms };
    });
    var total = parts.reduce(function (a, p) { return a + p.ms; }, 0);

    bar.innerHTML = parts.map(function (p) {
      return '<div title="' + meta[p.k].name + ' ' + p.ms + ' мс" style="width:' +
        (p.ms / total * 100).toFixed(1) + "%;background:var(" + meta[p.k].tint +
        ');display:flex;align-items:center;justify-content:center;color:var(--paper);' +
        'font-family:var(--font-ui);font-size:.7rem;overflow:hidden">' +
        (p.ms / total > 0.12 ? p.ms : "") + "</div>";
    }).join("");

    var verdict = total <= 800
      ? ["разговор идёт живо, пауза почти не читается", "--practice"]
      : total <= 1500
        ? ["пауза заметна, собеседник ещё терпит", "--warn"]
        : ["собеседник успевает решить, что его не услышали, и начинает говорить снова", "--danger"];

    var worst = parts.slice().sort(function (a, b) { return b.ms - a.ms; })[0];

    out.innerHTML =
      "Всего до первого звука ответа: <b>" + total + " мс</b>. " +
      '<span style="color:var(' + verdict[1] + ')">' + verdict[0] + "</span><br>" +
      parts.map(function (p) { return meta[p.k].name + " " + p.ms; }).join(" · ") + " мс<br>" +
      '<div style="margin-top:.5rem;color:var(--ink-3)">Больше всего съедает «' + meta[worst.k].name +
      '», ' + worst.ms + " мс из " + total + ". " +
      (worst.k === "eou"
        ? "Порог паузы это чистое ожидание: агент уже всё слышал и просто ждёт, вдруг человек продолжит. Уменьшайте осторожно, короткий порог рвёт реплику на середине мысли."
        : worst.k === "llm"
          ? "Время до первого токена лечится моделью поменьше, коротким системным промптом и потоковой выдачей."
          : worst.k === "asr"
            ? "Распознавание хвоста лечится потоковым режимом: основную часть реплики можно расшифровать, пока человек ещё говорит."
            : worst.k === "tts"
              ? "Синтез лечится выдачей звука по первой готовой фразе, целиком ответ ждать незачем."
              : "Сеть лечится размещением ближе к пользователю и постоянным соединением вместо нового на каждый запрос.") +
      "</div>";
  }

  ids.forEach(function (k) { el[k].addEventListener("input", draw); });
  mode.addEventListener("change", draw);
  draw();
})();
</script>
</body>
</html>
