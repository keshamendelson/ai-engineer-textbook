<!doctype html>
<html lang="ru" data-theme="light">
<head>
<meta charset="utf-8">
<title>проба демо CTC</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<main style="padding:2rem;max-width:44rem;margin:0 auto">

<div class="demo">
  <span class="dt">Попробуйте · как выход сети превращается в слово</span>
  <p style="font-family:var(--font-ui);font-size:.85rem;color:var(--ink-2);margin-bottom:.8rem">
    Восемь кадров звука, на каждом сеть выбирает один символ или пустой знак. Кликайте по клеткам и смотрите, что получится после схлопывания повторов и удаления пустых знаков.
  </p>
  <div id="ctc-grid" style="overflow-x:auto;margin:.6rem 0"></div>
  <div class="row" style="gap:.5rem;margin-bottom:.6rem">
    <button class="btn ghost" id="ctc-a">Путь «ккооотт»</button>
    <button class="btn ghost" id="ctc-b">Путь «к_о_от»</button>
    <button class="btn ghost" id="ctc-c">Путь «_к_от_»</button>
  </div>
  <div class="out" id="ctc-out"></div>
</div>

</main>
<script>
/* демо: выравнивание CTC, схлопывание повторов и роль пустого знака */
(function () {
  var host = document.getElementById("ctc-grid");
  if (!host) return;
  var out = document.getElementById("ctc-out");
  var alpha = ["_", "к", "о", "т"];
  var T = 8;
  var target = "кот";
  var path = ["к", "к", "о", "о", "о", "т", "т", "_"];

  function decode(p) {
    var collapsed = [], prev = null;
    for (var i = 0; i < p.length; i++) {
      if (p[i] !== prev) collapsed.push(p[i]);
      prev = p[i];
    }
    return { collapsed: collapsed.join(""), text: collapsed.filter(function (c) { return c !== "_"; }).join("") };
  }

  /* сколько всего путей длины T схлопывается в целевое слово: прямой проход CTC по
     расширенной последовательности с пустыми знаками между символами */
  function countPaths(word, T) {
    var ext = ["_"];
    for (var i = 0; i < word.length; i++) { ext.push(word[i]); ext.push("_"); }
    var S = ext.length;
    var dp = new Array(S).fill(0);
    dp[0] = 1; if (S > 1) dp[1] = 1;
    for (var t = 1; t < T; t++) {
      var nd = new Array(S).fill(0);
      for (var s = 0; s < S; s++) {
        var v = dp[s];
        if (s > 0) v += dp[s - 1];
        if (s > 1 && ext[s] !== "_" && ext[s] !== ext[s - 2]) v += dp[s - 2];
        nd[s] = v;
      }
      dp = nd;
    }
    return dp[S - 1] + (S > 1 ? dp[S - 2] : 0);
  }

  function draw() {
    var html = '<table style="border-collapse:separate;border-spacing:3px;font-family:var(--font-ui);font-size:.8rem">';
    for (var a = 0; a < alpha.length; a++) {
      html += "<tr><td style='color:var(--ink-2);padding-right:.4rem;text-align:right'>" +
        (alpha[a] === "_" ? "пусто" : alpha[a]) + "</td>";
      for (var t = 0; t < T; t++) {
        var on = path[t] === alpha[a];
        html += "<td data-t='" + t + "' data-a='" + a + "' style=\"cursor:pointer;width:2.1rem;height:1.8rem;" +
          "text-align:center;border-radius:5px;border:1.5px solid " +
          (on ? "var(--accent)" : "var(--line)") + ";background:" +
          (on ? "var(--accent-soft)" : "transparent") + ";color:" +
          (on ? "var(--accent)" : "var(--ink-3)") + '">' + (on ? "●" : "") + "</td>";
      }
      html += "</tr>";
    }
    html += "<tr><td></td>";
    for (var k = 0; k < T; k++) html += "<td style='color:var(--ink-3);font-size:.7rem;text-align:center'>" + (k + 1) + "</td>";
    html += "</tr></table>";
    host.innerHTML = html;
    show();
  }

  function show() {
    var d = decode(path);
    var ok = d.text === target;
    out.innerHTML =
      "Путь по кадрам: <code>" + path.join("") + "</code><br>" +
      "После схлопывания повторов: <code>" + d.collapsed + "</code><br>" +
      "После удаления пустых знаков: <code>" + (d.text || "пусто") + "</code>" +
      '<div style="margin-top:.5rem;color:' + (ok ? "var(--practice)" : "var(--warn)") + '">' +
      (ok ? "Это слово «кот». " : "Получилось «" + (d.text || "пусто") + "», а нужно «кот». ") +
      "</div>" +
      '<div style="margin-top:.4rem;color:var(--ink-3)">Схлопывание идёт до удаления пустых знаков, поэтому пустой знак между двумя одинаковыми буквами их и спасает: путь <code>оо</code> даёт одну букву, а путь <code>о_о</code> две. ' +
      "Всего путей длины " + T + ", которые дают «" + target + "», ровно " + countPaths(target, T) +
      ". Обучение CTC складывает вероятности всех таких путей сразу, поэтому размечать границы букв вручную не нужно.</div>";
  }

  host.addEventListener("click", function (e) {
    var td = e.target.closest("[data-t]");
    if (!td) return;
    path[+td.getAttribute("data-t")] = alpha[+td.getAttribute("data-a")];
    draw();
  });
  document.getElementById("ctc-a").addEventListener("click", function () {
    path = ["к", "к", "о", "о", "о", "т", "т", "_"]; draw();
  });
  document.getElementById("ctc-b").addEventListener("click", function () {
    path = ["к", "_", "о", "_", "о", "т", "_", "_"]; draw();
  });
  document.getElementById("ctc-c").addEventListener("click", function () {
    path = ["_", "к", "_", "о", "т", "_", "_", "_"]; draw();
  });
  draw();
})();
</script>
</body>
</html>
