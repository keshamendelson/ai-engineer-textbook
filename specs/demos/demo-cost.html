<!doctype html>
<html lang="ru" data-theme="light">
<head>
<meta charset="utf-8">
<title>проба демо стоимости конвейера</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<main style="padding:2rem;max-width:44rem;margin:0 auto">

<div class="demo">
  <span class="dt">Попробуйте · во что обходится конвейер за месяц</span>
  <p style="font-family:var(--font-ui);font-size:.85rem;color:var(--ink-2);margin-bottom:.8rem">
    Считаем один и тот же поток запросов четырьмя способами. Цены заданы в рублях за тысячу токенов и настраиваются, потому что у каждого поставщика они свои. Кеш промпта считается по правилу: запись дороже обычного входа, попадание дешевле.
  </p>
  <div class="row">
    <label>Запросов в день <span class="val" id="c-r-v">2000</span>
      <input type="range" id="c-r" min="100" max="20000" step="100" value="2000">
    </label>
    <label>Неизменная часть промпта, токенов <span class="val" id="c-s-v">1800</span>
      <input type="range" id="c-s" min="0" max="6000" step="100" value="1800">
    </label>
  </div>
  <div class="row">
    <label>Меняющаяся часть, токенов <span class="val" id="c-v-v">1200</span>
      <input type="range" id="c-v" min="100" max="20000" step="100" value="1200">
    </label>
    <label>Ответ, токенов <span class="val" id="c-o-v">400</span>
      <input type="range" id="c-o" min="50" max="4000" step="50" value="400">
    </label>
  </div>
  <div class="row">
    <label>Доля сложных запросов для каскада <span class="val" id="c-e-v">20 процентов</span>
      <input type="range" id="c-e" min="0" max="100" step="5" value="20">
    </label>
    <label>Цена дорогой модели, ₽ за 1000 входных <span class="val" id="c-p-v">0,50</span>
      <input type="range" id="c-p" min="5" max="300" step="5" value="50">
    </label>
  </div>
  <div id="c-bars" style="margin:.9rem 0"></div>
  <div class="out" id="c-out"></div>
</div>

</main>
<script>
/* демо: во что обходится один и тот же поток запросов при разных приёмах экономии */
(function () {
  var host = document.getElementById("c-bars");
  if (!host) return;
  var out = document.getElementById("c-out");
  var ids = ["r", "s", "v", "o", "e", "p"];
  var el = {};
  ids.forEach(function (k) { el[k] = document.getElementById("c-" + k); });

  function plural(n, one, few, many) {
    var r = Math.abs(n) % 100;
    if (r >= 11 && r <= 14) return many;
    r %= 10;
    return r === 1 ? one : (r >= 2 && r <= 4 ? few : many);
  }

  function draw() {
    var reqDay = +el.r.value, stat = +el.s.value, varPart = +el.v.value;
    var outTok = +el.o.value, esc = +el.e.value / 100;
    var inPrice = +el.p.value / 100;           // рублей за тысячу входных токенов
    var outPrice = inPrice * 3;                // выход обычно дороже входа примерно втрое
    var cheapFactor = 1 / 15;                  // дешёвая модель примерно в пятнадцать раз дешевле

    document.getElementById("c-r-v").textContent = reqDay;
    document.getElementById("c-s-v").textContent = stat;
    document.getElementById("c-v-v").textContent = varPart;
    document.getElementById("c-o-v").textContent = outTok;
    document.getElementById("c-e-v").textContent = (esc * 100).toFixed(0) + " процентов";
    document.getElementById("c-p-v").textContent = inPrice.toFixed(2).replace(".", ",");

    var perMonth = reqDay * 30;
    function money(inTok, outT, price) { return (inTok / 1000) * price + (outT / 1000) * price * 3; }

    var base = money(stat + varPart, outTok, inPrice);

    // кеш: неизменная часть записывается раз в сутки дороже, дальше читается дешевле
    var cacheWrite = (stat / 1000) * inPrice * 1.25;
    var cacheHit = (stat / 1000) * inPrice * 0.1;
    var withCache = cacheHit + money(varPart, outTok, inPrice);

    // каскад: дешёвая модель на всё, дорогая только на сложное
    var cheap = money(stat + varPart, outTok, inPrice * cheapFactor);
    var cascade = cheap + esc * base;

    // каскад вместе с кешем
    var both = cheapFactor * cacheHit + money(varPart, outTok, inPrice * cheapFactor)
             + esc * withCache;

    var rows = [
      { name: "как есть, одна дорогая модель", v: base },
      { name: "плюс кеш неизменной части", v: withCache },
      { name: "каскад дешёвая плюс дорогая", v: cascade },
      { name: "каскад вместе с кешем", v: both },
    ];
    var max = rows[0].v || 1;

    host.innerHTML = rows.map(function (r) {
      var month = r.v * perMonth;
      var save = (1 - r.v / max) * 100;
      return '<div class="bar-row"><span class="bl" style="flex:0 0 15rem;text-align:left">' +
        r.name + '</span><span class="bb"><i style="width:' + (r.v / max * 100).toFixed(0) +
        "%;background:var(" + (save > 60 ? "--practice" : save > 20 ? "--accent" : "--warn") +
        ')"></i></span><span class="bv">' +
        (month >= 1000 ? Math.round(month / 1000) + "т ₽" : Math.round(month) + " ₽") + "</span></div>";
    }).join("");

    var bestSave = (1 - both / base) * 100;
    out.innerHTML =
      "При " + reqDay + " запросах в день это " + perMonth.toLocaleString("ru") +
      " запросов в месяц. Без приёмов экономии выходит <b>" +
      Math.round(base * perMonth).toLocaleString("ru") + " ₽</b> в месяц, со всеми приёмами <b>" +
      Math.round(both * perMonth).toLocaleString("ru") + " ₽</b>, то есть на " +
      bestSave.toFixed(0) + " " + plural(Math.round(bestSave), "процент", "процента", "процентов") +
      " меньше.<br>" +
      '<div style="margin-top:.5rem;color:var(--ink-3)">' +
      (stat / (stat + varPart) > 0.5
        ? "Неизменная часть занимает больше половины входа, поэтому кеш промпта здесь и даёт основную экономию."
        : "Неизменная часть невелика, кеш почти ничего не даст. Смотрите в сторону каскада и сокращения контекста.") +
      " Запись в кеш стоит дороже обычного входа, около " + (cacheWrite / base * 100).toFixed(0) +
      " процентов цены запроса, и окупается со второго попадания." +
      (esc > 0.5 ? " Доля сложных запросов больше половины: каскад в такой ситуации почти не экономит, зато добавляет задержку на маршрутизацию." : "") +
      "</div>";
  }

  ids.forEach(function (k) { el[k].addEventListener("input", draw); });
  draw();
})();
</script>
</body>
</html>
